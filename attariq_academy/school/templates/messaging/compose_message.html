{% extends 'base.html' %}
{% block title %}Compose Message - Attariq Academy{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white"><h2 class="h5 mb-0">Compose New Message</h2></div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid"><button type="submit" class="btn btn-primary">Send Message</button></div>
                    </form>
                </div>
            </div>
             <a href="{% url 'school:inbox' %}" class="btn btn-secondary mt-3">Back to Inbox</a>
        </div>
    </div>
</div>
{% endblock %}
